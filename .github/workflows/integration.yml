name: Integration & Regression Tests

on:
  push:
    branches: [testing, staging, main]
  pull_request:
    branches: [testing, staging, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.label || github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  integration-tests:
    name: "Integration & API Tests"
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: civicconnect_test
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: civicconnect_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://civicconnect_test:test_password@localhost:5432/civicconnect_test_db
      NODE_ENV: test
      SESSION_SECRET: ci_test_session_secret_placeholder

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read Node version from .nvmrc
        run: echo "NODE_VERSION=$(cat .nvmrc)" >> $GITHUB_ENV

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build CSS (Tailwind)
        run: npm run build:css

      - name: Run database migrations
        run: npm run db:migrate

      - name: Run integration & API tests with coverage
        run: npx jest --config jest.integration.config.js --coverage --ci --runInBand --coverageReporters=lcov

      - name: Upload integration test coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-coverage
          path: coverage/lcov.info
          retention-days: 30

  regression:
    name: "Regression Suite"
    runs-on: ubuntu-latest
    needs: integration-tests

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: civicconnect_test
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: civicconnect_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://civicconnect_test:test_password@localhost:5432/civicconnect_test_db
      NODE_ENV: test
      SESSION_SECRET: ci_test_session_secret_placeholder

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read Node version from .nvmrc
        run: echo "NODE_VERSION=$(cat .nvmrc)" >> $GITHUB_ENV

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build CSS (Tailwind)
        run: npm run build:css

      - name: Run database migrations
        run: npm run db:migrate

      - name: Run full regression suite
        run: npx jest --config jest.regression.config.js --ci --runInBand