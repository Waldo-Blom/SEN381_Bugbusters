name: CI — Lint & Unit Tests

on:
  push:
    branches: [testing, staging, main]
  pull_request:
    branches: [testing, staging, main]

# Cancel in-progress runs for the same branch/PR to save resources.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.label || github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ------------------------------------------------------------------
  # JOB 1: Static Analysis (fast feedback first)
  # ------------------------------------------------------------------
  lint:
    name: "Static Analysis (ESLint + Prettier)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Read Node version from .nvmrc
        run: echo "NODE_VERSION=$(cat .nvmrc)" >> $GITHUB_ENV

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build CSS (Tailwind)
        run: npm run build:css

      - name: Run ESLint
        run: npm run lint

      - name: Check Prettier formatting
        run: npx prettier --check .

  # ------------------------------------------------------------------
  # JOB 2: Unit Tests (fast, no external dependencies)
  # ------------------------------------------------------------------
  unit-tests:
    name: "Unit Tests"
    runs-on: ubuntu-latest
    needs: lint   # Fail fast: don't run tests if lint fails
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read Node version from .nvmrc
        run: echo "NODE_VERSION=$(cat .nvmrc)" >> $GITHUB_ENV

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build CSS (Tailwind)
        run: npm run build:css

      - name: Run unit tests with coverage
        run: npx jest --config jest.config.js --coverage --ci --coverageReporters=lcov

      - name: Upload unit test coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-coverage
          path: coverage/lcov.info
          retention-days: 30