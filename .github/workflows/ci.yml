name: CI

# One pipeline for the whole project (SEN381 M3: "one working pipeline is enough").
# Every PR and push to dev / testing / staging / main runs the same checks, and the
# `CI gate` job at the bottom is the single required status check.
on:
  push:
    branches: [dev, testing, staging, main]
  pull_request:
    branches: [dev, testing, staging, main]
  workflow_dispatch:

# Cancel superseded runs of the same PR / branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Database/session credentials are scoped only to jobs that need them.
# Configure NEON_DATABASE_URL and CI_SESSION_SECRET as GitHub Actions secrets.

jobs:
  # ------------------------------------------------------------------
  # STATIC / SECURITY CHECKS
  # ------------------------------------------------------------------
  lint:
    name: Static analysis (ESLint + Prettier)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node
      - run: npm run lint
      - run: npx prettier --check .

  dependency-audit:
    name: Dependency check (npm audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node
        with:
          build-css: 'false'
      # Production dependencies only; fails on high/critical findings.
      - run: npm audit --omit=dev --audit-level=high

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # scan full history, not just the latest commit
          persist-credentials: false
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz | tar -xz gitleaks
      - name: Scan repository history
        run: ./gitleaks detect --source . --redact --verbose

  # ------------------------------------------------------------------
  # AUTOMATED TESTS
  # Only unfinished placeholder suites use --passWithNoTests. A green empty
  # suite is not evidence that its behaviours are verified.
  # ------------------------------------------------------------------
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NODE_ENV: test
      # Unit tests instantiate pg.Pool but mock database operations. Use a
      # harmless local URL instead of exposing the CI database to this job.
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
      SESSION_SECRET: ${{ secrets.CI_SESSION_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node
      - name: Run unit tests
        run: npx jest --selectProjects unit --ci

  functional-tests:
    name: Black-box functional tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NODE_ENV: test
      SESSION_SECRET: ${{ secrets.CI_SESSION_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node
      - name: Run black-box functional tests
        run: npx jest --selectProjects functional --ci --runInBand

  integration:
    name: Integration & API tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [db-test]
    env:
      NODE_ENV: test
      DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      SESSION_SECRET: ${{ secrets.CI_SESSION_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node
      - name: Run integration and API tests
        run: npx jest --selectProjects integration --ci --runInBand

  performance-tests:
    name: Performance test plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NODE_ENV: test
      SESSION_SECRET: ${{ secrets.CI_SESSION_SECRET }}
      PERFORMANCE_TEST: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node
      - name: Run performance test plan
        run: npx jest --selectProjects performance --ci --runInBand

  # ------------------------------------------------------------------
  # SIMULATED STAGING + E2E
  # Starts the app the way it runs in production (NODE_ENV=production,
  # preconfigured Neon database, config from environment variables), waits for
  # /health, then runs the critical end-to-end journeys against it.
  # ------------------------------------------------------------------
  e2e:
    name: E2E on simulated staging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [db-test]
    env:
      NODE_ENV: production
      PORT: 3000
      BASE_URL: http://localhost:3000
      DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      SESSION_SECRET: ${{ secrets.CI_SESSION_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node
      - name: Start application
        run: |
          node src/server.js > server.log 2>&1 &
          echo $! > server.pid
      - name: Wait for /health to return 200
        run: curl --fail --silent --show-error --retry 30 --retry-delay 1 --retry-connrefused http://localhost:3000/health
      - name: Run E2E tests
        # The E2E suite drives its own in-process Express app with mocked storage.
        # Use test cookie settings so Supertest's HTTP agent can retain sessions;
        # the separately started production server is only used by the health check.
        env:
          NODE_ENV: test
        run: npx jest --selectProjects e2e --ci --runInBand
      - name: Show server log on failure
        if: failure()
        run: cat server.log
      - name: Stop application
        if: always()
        run: kill "$(cat server.pid)" 2>/dev/null || true

  db-test:
    name: Neon database check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node
        with:
          build-css: 'false'
      - name: Check Neon connection and schema
        run: npm run db:test

  # ------------------------------------------------------------------
  # QUALITY GATE
  # Make this the required status check in branch protection. If any
  # required job fails, is cancelled or is skipped, this fails and the PR
  # cannot be merged.
  # ------------------------------------------------------------------
  ci-gate:
    name: CI gate
    needs:
      [
        lint,
        dependency-audit,
        secret-scan,
        unit-tests,
        functional-tests,
        integration,
        performance-tests,
        e2e,
        db-test,
      ]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify all required jobs succeeded
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "true" ]; then
            echo "One or more required jobs did not succeed."
            exit 1
          fi
